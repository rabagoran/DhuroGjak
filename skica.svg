<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, sans-serif" font-size="14">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">DhuroGjak — skica e tre ekraneve (Java 2)</text>

  <!-- Ekrani 1: Lista -->
  <g transform="translate(40,60)">
    <rect width="260" height="540" rx="28" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="130" y="-8" text-anchor="middle" font-weight="700">1. Lista e kërkesave</text>
    <rect x="16" y="20" width="228" height="40" rx="8" fill="#b91c1c"/>
    <text x="30" y="46" fill="#fff" font-weight="700">🩸 DhuroGjak</text>
    <text x="16" y="88" font-weight="700">Kërkesat aktive</text>
    <g transform="translate(16,100)">
      <rect width="228" height="110" rx="10" fill="#fff" stroke="#b91c1c"/>
      <rect x="10" y="10" width="44" height="28" rx="6" fill="#b91c1c"/><text x="20" y="29" fill="#fff" font-weight="700">O-</text>
      <text x="64" y="22">URGJENTE · QKUK</text><text x="64" y="40" fill="#555">Prishtinë · deri 18:00</text>
      <text x="10" y="66">1 nga 2 dhurues ✅</text>
      <rect x="10" y="74" width="208" height="8" rx="4" fill="#eee"/><rect x="10" y="74" width="104" height="8" rx="4" fill="#b91c1c"/>
      <text x="10" y="102" fill="#b91c1c">Shiko detajet →</text>
    </g>
    <g transform="translate(16,222)">
      <rect width="228" height="110" rx="10" fill="#fff" stroke="#999"/>
      <rect x="10" y="10" width="44" height="28" rx="6" fill="#b91c1c"/><text x="18" y="29" fill="#fff" font-weight="700">A+</text>
      <text x="64" y="22">Spitali Peja</text><text x="64" y="40" fill="#555">Pejë · nesër 12:00</text>
      <text x="10" y="66">0 nga 3 dhurues</text>
      <rect x="10" y="74" width="208" height="8" rx="4" fill="#eee"/>
      <text x="10" y="102" fill="#b91c1c">Shiko detajet →</text>
    </g>
    <rect x="16" y="350" width="228" height="44" rx="10" fill="#b91c1c"/><text x="130" y="378" text-anchor="middle" fill="#fff" font-weight="700">+ Posto kërkesë</text>
    <line x1="0" y1="480" x2="260" y2="480" stroke="#ccc"/>
    <text x="22" y="512">Kërkesat · Qendrat · Statistikat · Profili</text>
  </g>

  <!-- Ekrani 2: Detajet -->
  <g transform="translate(350,60)">
    <rect width="260" height="540" rx="28" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="130" y="-8" text-anchor="middle" font-weight="700">2. Detajet e kërkesës</text>
    <text x="16" y="44" fill="#b91c1c">← Kthehu te lista</text>
    <rect x="16" y="60" width="64" height="44" rx="8" fill="#b91c1c"/><text x="30" y="90" fill="#fff" font-size="22" font-weight="700">O-</text>
    <text x="92" y="78" font-weight="700">QKUK Prishtinë</text><text x="92" y="98" fill="#555">2 doza · deri sot 18:00</text>
    <text x="16" y="140">Pacient në kirurgji, urgjent.</text>
    <text x="16" y="176" font-weight="700">1 nga 2 dhurues u gjet ✅</text>
    <rect x="16" y="186" width="228" height="10" rx="5" fill="#eee"/><rect x="16" y="186" width="114" height="10" rx="5" fill="#b91c1c"/>
    <text x="16" y="226" fill="#555">Grupet që mund të dhurojnë: O-</text>
    <rect x="16" y="250" width="228" height="48" rx="10" fill="#b91c1c"/><text x="130" y="280" text-anchor="middle" fill="#fff" font-weight="700">❤ Do të shkoj</text>
    <text x="16" y="330" fill="#555">Telefoni i kërkuesit shfaqet</text>
    <text x="16" y="348" fill="#555">vetëm pasi të pranosh.</text>
    <text x="16" y="400" fill="#555" font-size="12">Përditësohet çdo 5 sekonda</text>
  </g>

  <!-- Ekrani 3: Në pritje / pranuar -->
  <g transform="translate(660,60)">
    <rect width="260" height="540" rx="28" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="130" y="-8" text-anchor="middle" font-weight="700">3. Pranuar · në pritje</text>
    <text x="16" y="44" fill="#b91c1c">← Kthehu te detajet</text>
    <circle cx="130" cy="110" r="38" fill="#fde8e8"/><text x="130" y="122" text-anchor="middle" font-size="34">✅</text>
    <text x="130" y="180" text-anchor="middle" font-weight="700">Faleminderit, Dreni!</text>
    <text x="130" y="202" text-anchor="middle" fill="#555">Kërkuesi u njoftua.</text>
    <rect x="16" y="226" width="228" height="96" rx="10" fill="#fff" stroke="#999"/>
    <text x="28" y="252">Kontakti: Arta</text><text x="28" y="274">📞 044 *** ***</text>
    <text x="28" y="304" fill="#555">QKUK, Qendra e transfuzionit</text>
    <text x="16" y="356" font-weight="700">Statusi: Në pritje të dhurimit</text>
    <text x="16" y="380" fill="#555">Pas dhurimit, kërkuesi e konfirmon.</text>
    <text x="16" y="400" fill="#555">Ti bllokohesh 90/120 ditë.</text>
    <rect x="16" y="430" width="228" height="44" rx="10" fill="#fff" stroke="#b91c1c"/><text x="130" y="458" text-anchor="middle" fill="#b91c1c">Anulo pjesëmarrjen</text>
  </g>
</svg>
